<style id="moonscanner-institutional-theme">

    --ms-bg: #06080E;

  <body>

<div id="ms-lock-screen" style="position:fixed;inset:0;background:#06080E;z-index:999999;display:flex;align-items:center;justify-content:center;padding:20px;font-family:system-ui,-apple-system,sans-serif;">
  <div style="background:rgba(15,23,42,0.92);border:1px solid rgba(56,189,248,0.25);border-radius:18px;padding:32px 24px;width:100%;max-width:380px;box-shadow:0 25px 60px rgba(0,0,0,0.85);backdrop-filter:blur(20px);text-align:center;">
    <div style="width:56px;height:56px;background:linear-gradient(135deg, #00F2FE 0%, #4FACFE 100%);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 0 25px rgba(0,242,254,0.4);">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
    </div>
    <h2 style="color:#FFF;font-size:22px;font-weight:700;margin:0 0 6px;">MoonScanner Pro</h2>
    <p style="color:#94A3B8;font-size:13px;margin:0 0 22px;">Institutional Whale Radar • VIP Access</p>
    
    <div id="ms-user-flow">
      <input id="ms-key-input" type="text" placeholder="Enter VIP Access Passcode" style="width:100%;padding:14px;background:rgba(2,6,23,0.7);border:1px solid rgba(56,189,248,0.3);border-radius:10px;color:#FFF;font-size:14px;margin-bottom:12px;box-sizing:border-box;text-align:center;font-weight:600;outline:none;" />
      <button onclick="msUnlock()" style="width:100%;padding:14px;background:linear-gradient(135deg, #00F2FE 0%, #0072FF 100%);color:#000;font-weight:700;font-size:15px;border:none;border-radius:10px;cursor:pointer;">UNLOCK RADAR</button>
      <p id="ms-error-msg" style="color:#FF3366;font-size:13px;margin:10px 0 0;display:none;">Invalid or Revoked Passcode</p>
    </div>

    <div id="ms-admin-flow" style="display:none;margin-top:20px;text-align:left;border-top:1px solid rgba(255,255,255,0.1);padding-top:16px;">
      <h3 style="color:#00F2FE;font-size:13px;margin:0 0 8px;">Admin Key Manager</h3>
      <div style="display:flex;gap:8px;margin-bottom:10px;">
        <input id="ms-new-key" type="text" placeholder="e.g. VIP_RAHIM" style="flex:1;padding:8px;background:rgba(2,6,23,0.7);border:1px solid #334155;border-radius:8px;color:#FFF;font-size:12px;outline:none;" />
        <button onclick="msAddKey()" style="padding:8px 12px;background:#00E676;color:#000;border:none;border-radius:8px;font-weight:bold;font-size:12px;cursor:pointer;">ADD</button>
      </div>
      <div style="color:#94A3B8;font-size:11px;margin-bottom:6px;">ACTIVE KEYS:</div>
      <div id="ms-keys-list" style="max-height:120px;overflow-y:auto;background:rgba(0,0,0,0.3);border-radius:8px;padding:8px;"></div>
    </div>

    <div style="margin-top:18px;">
      <button onclick="msToggleAdmin()" style="background:none;border:none;color:#64748B;font-size:11px;cursor:pointer;text-decoration:underline;">Admin Mode</button>
    </div>
  </div>
</div>

<script>
  const DEFAULT_KEYS = ['MOON2026', 'VIP777'];
  function msGetKeys() {
    try {
      const stored = localStorage.getItem('ms_allowed_keys');
      return stored ? JSON.parse(stored) : DEFAULT_KEYS;
    } catch(e) { return DEFAULT_KEYS; }
  }
  function msSaveKeys(keys) {
    localStorage.setItem('ms_allowed_keys', JSON.stringify(keys));
  }
  function msCheckAuth() {
    const activeKey = localStorage.getItem('ms_user_key');
    const validKeys = msGetKeys();
    if (activeKey && validKeys.includes(activeKey)) {
      const lock = document.getElementById('ms-lock-screen');
      if (lock) lock.style.display = 'none';
    }
  }
  function msUnlock() {
    const val = document.getElementById('ms-key-input').value.trim();
    const validKeys = msGetKeys();
    if (validKeys.includes(val)) {
      localStorage.setItem('ms_user_key', val);
      document.getElementById('ms-lock-screen').style.display = 'none';
    } else {
      const err = document.getElementById('ms-error-msg');
      err.style.display = 'block';
      setTimeout(() => { err.style.display = 'none'; }, 3000);
    }
  }
  function msToggleAdmin() {
    const pin = prompt('Enter Admin Master PIN:');
    if (pin === 'admin777') {
      const flow = document.getElementById('ms-admin-flow');
      flow.style.display = flow.style.display === 'none' ? 'block' : 'none';
      msRenderKeys();
    } else if (pin) {
      alert('Incorrect Admin PIN');
    }
  }
  function msRenderKeys() {
    const keys = msGetKeys();
    const list = document.getElementById('ms-keys-list');
    list.innerHTML = keys.map(k => '<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.05);color:#E2E8F0;font-size:12px;"><span>' + k + '</span><button onclick="msRevokeKey(\'' + k + '\')" style="background:#FF3366;color:#FFF;border:none;border-radius:4px;padding:2px 6px;font-size:10px;cursor:pointer;">REVOKE</button></div>').join('');
  }
  function msAddKey() {
    const newK = document.getElementById('ms-new-key').value.trim();
    if (!newK) return;
    const keys = msGetKeys();
    if (!keys.includes(newK)) {
      keys.push(newK);
      msSaveKeys(keys);
      document.getElementById('ms-new-key').value = '';
      msRenderKeys();
    }
  }
  function msRevokeKey(k) {
    let keys = msGetKeys().filter(item => item !== k);
    msSaveKeys(keys);
    msRenderKeys();
  }
  document.addEventListener('DOMContentLoaded', msCheckAuth);
  msCheckAuth();
</script>


<!-- In-App TradingView Live Chart Modal -->
<div id="ms-tv-modal" style="display:none;position:fixed;inset:0;background:rgba(4,6,10,0.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:9999999;align-items:center;justify-content:center;padding:12px;font-family:system-ui,-apple-system,sans-serif;">
  <div style="background:#080D1A;border:1px solid rgba(56,189,248,0.3);border-radius:18px;width:100%;max-width:960px;height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,0.95);">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:#050810;">
      <div style="display:flex;align-items:center;gap:12px;">
        <span id="ms-tv-symbol" style="color:#00F2FE;font-weight:700;font-size:16px;letter-spacing:0.5px;">BTCUSDT</span>
        <span style="background:rgba(0,230,118,0.15);color:#00E676;border:1px solid rgba(0,230,118,0.3);padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;">TradingView Pro Live</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <a id="ms-tv-external" href="#" target="_blank" style="color:#94A3B8;text-decoration:none;font-size:12px;padding:6px 12px;background:rgba(255,255,255,0.06);border-radius:8px;border:1px solid rgba(255,255,255,0.12);">Open Full Tab ↗</a>
        <button onclick="closeTvModal()" style="background:#FF3366;color:#FFF;border:none;border-radius:8px;padding:6px 14px;cursor:pointer;font-weight:bold;font-size:13px;">✕ Close</button>
      </div>
    </div>
    <div style="flex:1;width:100%;height:100%;position:relative;background:#06080E;">
      <iframe id="ms-tv-iframe" src="" style="width:100%;height:100%;border:none;"></iframe>
    </div>
  </div>
</div>

<script>
  window.openTradingViewModal = function(rawSymbol) {
    if (!rawSymbol) return;
    let s = rawSymbol.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
    if (!s.endsWith('USDT') && !s.endsWith('PERP')) s += 'USDT';
    const tvPair = 'BINANCE:' + s + '.P';
    const embedUrl = 'https://s.tradingview.com/widgetembed/?symbol=' + encodeURIComponent(tvPair) + '&interval=15&theme=dark&style=1&timezone=Asia%2FDhaka&studies=%5B%5D&hideideas=1';
    
    document.getElementById('ms-tv-symbol').textContent = s + ' (15m Candle)';
    document.getElementById('ms-tv-external').href = 'https://www.tradingview.com/chart/?symbol=' + encodeURIComponent(tvPair);
    document.getElementById('ms-tv-iframe').src = embedUrl;
    
    const m = document.getElementById('ms-tv-modal');
    m.style.display = 'flex';
  };

  window.closeTvModal = function() {
    const m = document.getElementById('ms-tv-modal');
    m.style.display = 'none';
    document.getElementById('ms-tv-iframe').src = '';
  };

  // Click Interceptor: Catch any click on Chart / Binance buttons and open in-app TradingView
  document.addEventListener('click', function(e) {
    const btn = e.target.closest('a, button, [role="button"]');
    if (!btn) return;
    const txt = (btn.textContent || '').trim();
    const href = btn.getAttribute('href') || '';
    if (txt.includes('Binance') || txt.includes('TradingView') || txt.includes('Chart') || href.includes('binance.com')) {
      const card = btn.closest('div[class*="rounded"], [class*="border"]');
      let sym = '';
      if (card) {
        const m = card.textContent.match(/\b([A-Z0-9]{3,12}USDT)\b/);
        if (m) sym = m[1];
      }
      if (!sym && href) {
        const m = href.match(/([A-Z0-9]+USDT)/i);
        if (m) sym = m[1];
      }
      if (sym) {
        e.preventDefault();
        e.stopPropagation();
        window.openTradingViewModal(sym);
      }
    }
  }, true);
</script>
