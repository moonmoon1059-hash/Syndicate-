<style id="moonscanner-institutional-theme">
  :root {
    --ms-bg-base: #06080E;
    --ms-card-bg: rgba(13, 19, 33, 0.78);
    --ms-border: rgba(56, 189, 248, 0.16);
    --ms-cyan: #00F2FE;
    --ms-emerald: #00E676;
    --ms-ruby: #FF3366;
  }
  body {
    background-color: #06080E !important;
    background-image: 
      radial-gradient(at 50% 0%, rgba(14, 165, 233, 0.16) 0px, transparent 55%),
      radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.08) 0px, transparent 50%),
      radial-gradient(at 0% 50%, rgba(16, 185, 129, 0.05) 0px, transparent 40%) !important;
    background-attachment: fixed !important;
    color: #F8FAFC !important;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif !important;
    -webkit-font-smoothing: antialiased !important;
  }
  /* Institutional Glassmorphic Cards */
  div[class*="rounded"], section[class*="rounded"], article[class*="rounded"] {
    backdrop-filter: blur(14px) !important;
    -webkit-backdrop-filter: blur(14px) !important;
  }
  /* Subtle glow on actionable elements */
  button {
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
  }
  button:active {
    transform: scale(0.97) !important;
  }
  /* Minimal High-Tech Scrollbar */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.18); border-radius: 9999px; }
</style>

</head>
